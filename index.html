<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday Vivi</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&family=Sacramento&family=Sriracha&family=Titan+One&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.7.1.min.js" crossorigin="anonymous"></script>

  <style>
    /* ================= GLOBAL RESET & BASE ================= */
    *, *::after, *::before {
      padding: 0;
      margin: 0;
      box-sizing: border-box;
    }

    :root {
      --dark-color: #000;
      --flower-blue: #a7ffee;
      --flower-white: #fff;
    }

    body {
      background-color: var(--dark-color);
      min-height: 100vh;
      overflow-x: hidden;
      font-family: 'Poppins', sans-serif;
      transition: background-color 1s ease;
    }

    body.birthday-active {
      background: #ffe3e8;
      overflow-y: auto;
    }

    /* ================= ORIGINAL FLOWER ANIMATION CSS ================= */
    .flower-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 1;
      overflow: hidden;
    }

    .night {
      position: fixed;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      filter: blur(0.1vmin);
      background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), radial-gradient(ellipse at bottom, var(--dark-color), rgba(145, 233, 255, 0.2)), repeating-linear-gradient(220deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px);
    }

    .flowers {
      position: relative;
      transform: scale(0.9);
      bottom: 2vmin;
    }

    .flower {
      position: absolute;
      bottom: 10vmin;
      transform-origin: bottom center;
      z-index: 10;
      --fl-speed: 0.8s;
    }

    .flower--1 { left: 5vmin; transform: rotate(10deg); animation: moving-flower-1 4s ease-in-out infinite; }
    .flower--2 { left: -5vmin; transform: rotate(-15deg); animation: moving-flower-2 4s ease-in-out infinite; }
    .flower--3 { left: 0; transform: rotate(0deg); animation: moving-flower-3 4s ease-in-out infinite; }

    .flower__line {
      height: 55vmin;
      width: 1.5vmin;
      background-image: linear-gradient(to left, rgba(0, 0, 0, 0.2), transparent, rgba(255, 255, 255, 0.2)), linear-gradient(to top, transparent 10%, #14757a, #39c6d6);
      box-shadow: inset 0 0 2px rgba(0, 0, 0, 0.5);
      animation: grow-flower-tree 4s backwards;
    }

    .flower__line__leaf {
      --w: 7vmin;
      --h: calc(var(--w) + 2vmin);
      position: absolute;
      top: 20%;
      left: 90%;
      width: var(--w);
      height: var(--h);
      border-top-right-radius: var(--h);
      border-bottom-left-radius: var(--h);
      background-image: linear-gradient(to top, rgba(20, 117, 122, 0.4), #39c6d6);
    }

    .flower__line__leaf--1 { transform: rotate(70deg) rotateY(30deg); }
    .flower__line__leaf--2 { top: 45%; transform: rotate(70deg) rotateY(30deg); }
    .flower__line__leaf--3, .flower__line__leaf--4, .flower__line__leaf--6 {
      border-top-right-radius: 0;
      border-bottom-left-radius: 0;
      border-top-left-radius: var(--h);
      border-bottom-right-radius: var(--h);
      left: -460%;
      top: 12%;
      transform: rotate(-70deg) rotateY(30deg);
    }
    .flower__line__leaf--4 { top: 40%; }
    .flower__line__leaf--5 { top: 0; transform-origin: left; transform: rotate(70deg) rotateY(30deg) scale(0.6); }
    .flower__line__leaf--6 { top: -2%; left: -450%; transform-origin: right; transform: rotate(-70deg) rotateY(30deg) scale(0.6); }

    .flower__leafs {
      position: relative;
      animation: blooming-flower 2s 0.8s backwards;
    }

    .flower__leaf {
      position: absolute;
      bottom: 0;
      left: 50%;
      width: 8vmin;
      height: 11vmin;
      border-radius: 51% 49% 47% 53% / 44% 45% 55% 56%;
      background-color: var(--flower-blue);
      background-image: linear-gradient(to top, #54b8aa, #a7ffee);
      transform-origin: bottom center;
      opacity: 0.9;
      box-shadow: inset 0 0 2vmin rgba(255, 255, 255, 0.5);
    }

    .flower__leaf--1 { transform: translate(-10%, 1%) rotateY(40deg) rotateX(-50deg); }
    .flower__leaf--2 { transform: translate(-50%, -4%) rotateX(40deg); }
    .flower__leaf--3 { transform: translate(-90%, 0%) rotateY(45deg) rotateX(50deg); }
    .flower__leaf--4 { width: 8vmin; height: 8vmin; transform-origin: bottom left; border-radius: 4vmin 10vmin 4vmin 4vmin; transform: translate(0%, 18%) rotateX(70deg) rotate(-43deg); background-image: linear-gradient(to top, #39c6d6, #a7ffee); z-index: 1; opacity: 0.8; }

    .flower__white-circle {
      position: absolute;
      left: -3.5vmin;
      top: -3vmin;
      width: 9vmin;
      height: 4vmin;
      border-radius: 50%;
      background-color: var(--flower-white);
    }

    .flower__light {
      position: absolute;
      bottom: 0;
      width: 1vmin;
      height: 1vmin;
      background-color: rgb(255, 251, 214);
      border-radius: 50%;
      filter: blur(0.2vmin);
      animation: light-ans 4s linear infinite backwards;
    }

    .flower__light--1 { left: -2vmin; transform: translateY(-5vmin); }
    .flower__light--2 { left: 3vmin; transform: translateY(-7vmin); animation-delay: 1s; }
    .flower__light--3 { left: -1vmin; transform: translateY(-11vmin); animation-delay: 0.5s; }
    .flower__light--4 { left: 4vmin; transform: translateY(-13vmin); animation-delay: 1.5s; }
    .flower__light--5 { left: -3vmin; transform: translateY(-16vmin); animation-delay: 2s; }
    .flower__light--6 { left: 2vmin; transform: translateY(-19vmin); animation-delay: 3s; }
    .flower__light--7 { left: -2vmin; transform: translateY(-22vmin); animation-delay: 2.2s; }
    .flower__light--8 { left: 3vmin; transform: translateY(-25vmin); animation-delay: 3.2s; }

    .growing-grass, .grow-ans, .long-g {
      animation: grow-ans-grass 2s var(--d, 0s) backwards;
    }

    .flower__grass {
      position: absolute;
      bottom: 12vmin;
      left: -7vmin;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 20;
      transform-origin: bottom center;
      transform: rotate(-48deg) rotateY(40deg);
    }
    .flower__grass--2 { left: 2vmin; bottom: 10vmin; transform: scale(-0.6, 0.6) rotate(35deg); opacity: 0.8; }

    .flower__grass--top {
      width: 7vmin;
      height: 10vmin;
      border-top-right-radius: 100%;
      border-right: 1.5vmin solid #159faa;
      transform-origin: bottom center;
      transform: rotate(-18deg);
    }

    .flower__grass--bottom {
      margin-top: -2px;
      width: 1.5vmin;
      height: 25vmin;
      background-image: linear-gradient(to top, transparent, #159faa);
    }

    .flower__grass__leaf {
      --size: 10vmin;
      position: absolute;
      width: calc(var(--size) * 2.1);
      height: var(--size);
      border-top-left-radius: var(--size);
      border-top-right-radius: var(--size);
      background-image: linear-gradient(to top, transparent, transparent 30%, #159faa);
      z-index: 1;
    }
    .flower__grass__leaf--1 { top: -6%; left: 30%; --size: 6vmin; transform: rotate(-20deg); }
    .flower__grass__leaf--2 { top: -5%; left: -110%; --size: 6vmin; transform: rotate(10deg); }
    .flower__grass__leaf--3 { top: 5%; left: 60%; --size: 8vmin; transform: rotate(-18deg); }
    .flower__grass__leaf--4 { top: 6%; left: -135%; --size: 8vmin; transform: rotate(2deg); }
    .flower__grass__leaf--5 { top: 20%; left: 60%; --size: 10vmin; transform: rotate(-24deg); }
    .flower__grass__leaf--6 { top: 22%; left: -180%; --size: 10vmin; transform: rotate(10deg); }
    .flower__grass__leaf--7 { top: 39%; left: 70%; --size: 10vmin; transform: rotate(-10deg); }
    .flower__grass__leaf--8 { top: 40%; left: -215%; --size: 11vmin; transform: rotate(10deg); }

    .flower__g-long {
      position: absolute;
      bottom: 10vmin;
      left: -3vmin;
      transform-origin: bottom center;
      transform: rotate(-30deg) rotateY(-20deg);
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }
    .flower__g-long__top { width: 10vmin; height: 18vmin; border-top-right-radius: 100%; border-right: 1.2vmin solid #159faa; }
    .flower__g-long__bottom { width: 1.2vmin; height: 38vmin; background-image: linear-gradient(to top, transparent 30%, #159faa); }

    .long-g { position: absolute; bottom: 2vmin; left: -10vmin; transform-origin: bottom left; }
    .long-g--1 { bottom: 0vmin; transform: scale(0.8) rotate(-5deg); }
    .long-g--2 { left: 10vmin; bottom: 5vmin; transform: scale(0.7) rotate(15deg); }
    .long-g--3 { left: 15vmin; bottom: 8vmin; transform: scale(0.6) rotate(-15deg); }
    .long-g--4 { left: -18vmin; bottom: 5vmin; transform: scale(0.75) rotate(20deg); }
    .long-g--5 { left: -25vmin; bottom: 3vmin; transform: scale(0.65) rotate(-20deg); }
    .long-g--6 { left: 25vmin; bottom: 4vmin; transform: scale(0.8) rotate(35deg); }
    .long-g--7 { left: 30vmin; bottom: 2vmin; transform: scale(0.55) rotate(-25deg); }

    .leaf {
      width: 15vmin;
      height: 25vmin;
      border-top-left-radius: 100%;
      border-left: 2vmin solid #079097;
      background-image: linear-gradient(to bottom, transparent, rgba(0, 0, 0, 0.4) 60%);
      transform-origin: bottom left;
    }

    @keyframes moving-flower-1 { 0%, 100% { transform: rotate(10deg); } 50% { transform: rotate(15deg); } }
    @keyframes moving-flower-2 { 0%, 100% { transform: rotate(-15deg); } 50% { transform: rotate(-8deg); } }
    @keyframes moving-flower-3 { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(5deg); } }
    @keyframes blooming-flower { 0% { transform: scale(0); } }
    @keyframes grow-flower-tree { 0% { height: 0; } }
    @keyframes grow-ans-grass { 0% { transform: scale(0); } }
    @keyframes light-ans {
      0% { opacity: 0; transform: translateY(0vmin); }
      25% { opacity: 1; transform: translateY(-5vmin) translateX(-2vmin); }
      50% { opacity: 1; transform: translateY(-15vmin) translateX(2vmin); filter: blur(0.2vmin); }
      75% { opacity: 0; transform: translateY(-20vmin) translateX(-2vmin); filter: blur(0.2vmin); }
      100% { opacity: 0; }
    }

    /* ================= GLASSMORPHIC LOVE LOGIN PORTAL ================= */
    .login-portal {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1.2s ease-in-out, transform 1s ease-in-out;
      transform: translateY(20px);
    }

    .login-portal.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .login-box {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      padding: 35px 30px;
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(255, 45, 117, 0.35);
      text-align: center;
      width: 320px;
      max-width: 90vw;
    }

    /* Requested Custom Sacramento Header */
    .login-box h1 {
      font-family: 'Sacramento', cursive;
      color: #ff2d75;
      font-size: 45px;
      font-weight: bold;
      margin-bottom: 10px;
      letter-spacing: 1px;
      text-shadow: 0 0 12px rgba(255, 45, 117, 0.6);
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 13px 18px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 25px;
      outline: none;
      color: #fff;
      font-size: 15px;
      text-align: center;
      transition: 0.3s;
    }

    .input-group input:focus {
      background: rgba(255, 255, 255, 0.25);
      border-color: #ff2d75;
      box-shadow: 0 0 10px rgba(255, 45, 117, 0.5);
    }

    .input-group input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(45deg, #ff2d75, #ff75c3);
      color: #fff;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 45, 117, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 5px;
    }

    .login-btn:hover {
      transform: scale(1.03);
      box-shadow: 0 6px 20px rgba(255, 45, 117, 0.7);
    }

    /* ================= SECTION 2: BIRTHDAY PAGE ================= */
    #wrapper {
      position: relative;
      width: 100%;
      min-height: 100vh;
      background: #ffe3e8;

        linear-gradient(rgba(255, 182, 193, 0.3) 1px, transparent 1px),

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 30px 15px;
    }

    .flag__birthday {

      top: 0;
      left: 0;

    }

    .content {

      align-items: center;

    .left {

    }

    .title h1.happy {

    .title .hat img {

    #btn__letter {

      border-radius: 30px;
      cursor: pointer;
      transition: 0.2s;
    }

    #btn__letter:hover {

    .right {

    }

    .box__account {

    .box__account .image {

    .box__account .image img {

    .box__account .name {

    .balloon_one {

    .balloon_two {

    .cricle {

    .letter-modal {

      cursor: pointer;
      font-weight: bold;
      box-shadow: 0 4px 15px rgba(255, 45, 117, 0.4);

  <!-- Floating Heart Cursor -->
  <script type="text/javascript">
    var colours = ['#ff3366', '#ff6699', '#ff33cc', '#ff99cc', '#ff66b2', '#ff0066']; 
    var minisize = 16; var maxisize = 28; var hearts = 66; var over_or_under = "over";

    function break_my_heart(i) {

      div.style.position = "absolute"; div.style.height = height; div.style.width = width;
      div.style.overflow = "hidden"; div.style.backgroundColor = "transparent";
      return div;
    }
  </script>

      <p id="letterContent">
        இனிய பிறந்தநாள் நல்வாழ்த்துகள் விவி! ✨<br>
        உன்னுடைய எல்லா கனவுகளும் ஆசைகளும் நிறைவேறி, எப்போதுமே சிரித்த முகத்தோடு மகிழ்ச்சியாக இருக்க மனமார்ந்த வாழ்த்துகள்! 💖🐾

  <!-- ================= APPLICATION SCRIPTS ================= -->
  <script>
    // 1. Automatic Show Login Portal after Flower Animation Blooms (~5.5s)
    window.addEventListener("load", function() {
      setTimeout(function() {
        const portal = document.getElementById("loginPortal");
        if (portal) {
          portal.classList.add("show");
        }
      }, 5500);
    });

    // 2. Love Login Validation
    document.getElementById("loginBtn").addEventListener("click", handleLogin);
    document.getElementById("password").addEventListener("keypress", function(e) {
      if (e.key === "Enter") handleLogin();
    });

    function handleLogin() {
      var user = document.getElementById("username").value.trim().toLowerCase();
      var pass = document.getElementById("password").value.trim().toLowerCase();
      var errorMsg = document.getElementById("errorMsg");
      var bgMusic = document.getElementById("bgMusic");

      if (user === "vivi" && pass === "naai kutty") {
        errorMsg.style.display = "none";
        
        // Hide Section 1 (Flowers & Login)
        document.getElementById("firstSection").style.display = "none";
        document.body.classList.add("birthday-active");

        // Show Section 2 (Birthday Page)
        document.getElementById("wrapper").style.display = "flex";

        // Play Music
        if (bgMusic) {
          bgMusic.play().catch(function(err) {
            console.log("Audio autoplay prevented:", err);
          });
        }
      } else {
        errorMsg.innerText = "Username or Password thappu! Marubadiyum try pannunga 😿";
        errorMsg.style.display = "block";
      }
    }

    // 3. Birthday Letter Popup Handlers
    document.getElementById("btn__letter").addEventListener("click", function() {
      document.getElementById("letterModal").style.display = "flex";
    });

    document.getElementById("closeLetterBtn").addEventListener("click", function() {
      document.getElementById("letterModal").style.display = "none";
    });
